<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeleShort</title><script src="https://cdn.tailwindcss.com"></script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script><style>body{font-family:Inter,system-ui;background:#0f172a;color:#f8fafc;overflow-x:hidden}.ad-slot{display:flex;justify-content:center;align-items:center;overflow:hidden;min-height:0}.ad-slot:empty{display:none}.ad-header{max-width:1200px;margin:0 auto}.ad-sidebar{width:100%;min-height:90px}.ad-bottom{max-width:1200px;margin:0 auto}.glass{background:rgba(30,41,59,.82);border:1px solid rgba(255,255,255,.07);border-radius:1rem}.tab{cursor:pointer}</style></head>
<body class="min-h-screen"><div id="ad-header" class="ad-slot ad-header w-full px-3 py-2"></div>
<div id="auth" class="min-h-screen flex items-center justify-center p-4"><div class="glass p-7 w-full max-w-md"><div class="text-3xl mb-2">⚡</div><h1 class="text-3xl font-bold">TeleShort</h1><p class="text-slate-400 mt-1 mb-6">Web short-link platform</p><div class="flex gap-2 mb-5"><button id="loginTab" onclick="authMode('login')" class="flex-1 bg-indigo-600 rounded-xl p-3 font-bold">Login</button><button id="registerTab" onclick="authMode('register')" class="flex-1 bg-slate-800 rounded-xl p-3">Register</button></div><form id="authForm" onsubmit="submitAuth(event)" class="space-y-3"><input id="email" type="email" required placeholder="Email" class="w-full bg-slate-950 p-3 rounded-xl"><input id="password" type="password" required minlength="8" placeholder="Password (8+ characters)" class="w-full bg-slate-950 p-3 rounded-xl"><div id="registerFields" class="hidden grid grid-cols-2 gap-3"><input id="first" placeholder="First name" class="bg-slate-950 p-3 rounded-xl"><input id="last" placeholder="Last name" class="bg-slate-950 p-3 rounded-xl"><input id="username" placeholder="Username" class="col-span-2 bg-slate-950 p-3 rounded-xl"><div id="turnstileWrap" class="col-span-2 hidden"><div id="turnstileWidget"></div></div></div><button id="authBtn" class="w-full bg-indigo-600 rounded-xl p-3 font-bold">Login</button><p id="authError" class="text-red-400 text-sm"></p></form></div></div>
<div id="dash" class="hidden min-h-screen"><header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-10"><div class="max-w-6xl mx-auto p-4 flex items-center justify-between"><div><b class="text-xl text-indigo-400">⚡ TeleShort</b><div id="welcome" class="text-xs text-slate-500"></div></div><button onclick="logout()" class="text-red-400">Logout</button></div></header><main class="max-w-7xl mx-auto p-3 sm:p-4 md:p-8"><div class="grid grid-cols-1 lg:grid-cols-[180px_minmax(0,1fr)_180px] gap-4 items-start"><aside id="ad-left" class="ad-slot ad-sidebar hidden lg:flex sticky top-24"></aside><div class="min-w-0"><div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6"><div class="glass p-4"><div class="text-xs text-slate-400">Balance</div><div id="balance" class="text-2xl font-bold mt-2">$0</div></div><div class="glass p-4"><div class="text-xs text-slate-400">Total earnings</div><div id="earnings" class="text-2xl font-bold mt-2">$0</div></div><div class="glass p-4"><div class="text-xs text-slate-400">Clicks</div><div id="clicks" class="text-2xl font-bold mt-2">0</div></div><div class="glass p-4"><div class="text-xs text-slate-400">Today</div><div id="today" class="text-2xl font-bold mt-2">$0</div></div></div>
<div class="grid lg:grid-cols-3 gap-5"><section class="glass p-5 lg:col-span-2"><h2 class="text-xl font-bold mb-4">Create Short Link</h2><div class="flex gap-2"><input id="longUrl" type="url" placeholder="https://example.com" class="flex-1 bg-slate-950 p-3 rounded-xl"><button onclick="createLink()" class="bg-indigo-600 px-5 rounded-xl font-bold">Shorten</button></div><div id="created" class="mt-4"></div><h3 class="font-bold mt-8 mb-3">Your links</h3><div id="links" class="space-y-2"></div></section>
<section class="space-y-5"><div class="glass p-5"><h2 class="font-bold text-lg mb-3">API Key</h2><p class="text-slate-400 text-sm mb-2">Current key ending: <span id="last4"></span></p><button onclick="rotateKey()" class="bg-slate-800 rounded-xl px-4 py-2">Rotate API key</button><p class="text-xs text-amber-300 mt-3">A new key is shown only once. Update your API clients after rotation.</p></div><div class="glass p-5"><h2 class="font-bold text-lg mb-3">Withdraw</h2><input id="amount" type="number" step="0.000001" placeholder="Amount ($)" class="w-full bg-slate-950 p-3 rounded-xl mb-2"><input id="method" placeholder="Payment method" class="w-full bg-slate-950 p-3 rounded-xl mb-2"><textarea id="details" placeholder="Payout details" class="w-full bg-slate-950 p-3 rounded-xl mb-2"></textarea><button onclick="withdraw()" class="w-full bg-indigo-600 rounded-xl p-3 font-bold">Request withdrawal</button><p id="withdrawMsg" class="text-sm mt-2"></p></div><div class="glass p-5"><h2 class="font-bold text-lg mb-2">Referral</h2><input id="refLink" readonly class="w-full bg-slate-950 p-3 rounded-xl text-xs"><button onclick="navigator.clipboard.writeText(refLink.value)" class="mt-2 bg-slate-800 rounded-xl px-4 py-2">Copy</button></div></section></div><aside id="ad-right" class="ad-slot ad-sidebar hidden lg:flex sticky top-24"></aside></div></main><div id="ad-bottom" class="ad-slot ad-bottom w-full px-3 py-2"></div></div>
<script>
let mode='login',me=null,csrfToken='';const ret=new URLSearchParams(location.search).get('return')||'';function authMode(m){mode=m;registerFields.classList.toggle('hidden',m!=='register');if(m==='register')setTimeout(renderTurnstile,250);authBtn.textContent=m==='login'?'Login':'Create account';loginTab.className=m==='login'?'flex-1 bg-indigo-600 rounded-xl p-3 font-bold':'flex-1 bg-slate-800 rounded-xl p-3';registerTab.className=m==='register'?'flex-1 bg-indigo-600 rounded-xl p-3 font-bold':'flex-1 bg-slate-800 rounded-xl p-3'}
let turnstileToken='';let turnstileWidgetId=null;let turnstileSiteKey='';async function loadSecurityConfig(){try{const r=await fetch('/api/user',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({action:'get_public_config'})});const d=await r.json();turnstileSiteKey=d?.settings?.turnstile_site_key||'';if(turnstileSiteKey&&window.turnstile)renderTurnstile();}catch{}}function renderTurnstile(){if(!turnstileSiteKey||!window.turnstile||turnstileWidgetId!==null)return;window.turnstile.ready(()=>{if(turnstileWidgetId!==null)return;turnstileWidgetId=window.turnstile.render('#turnstileWidget',{sitekey:turnstileSiteKey,theme:'dark',callback:t=>turnstileToken=t,'expired-callback':()=>turnstileToken='','error-callback':()=>turnstileToken=''});turnstileWrap.classList.remove('hidden')})}function resetTurnstile(){turnstileToken='';if(window.turnstile&&turnstileWidgetId!==null)window.turnstile.reset(turnstileWidgetId)}async function submitAuth(e){e.preventDefault();authError.textContent='';authBtn.disabled=true;try{const body={action:mode,email:email.value,password:password.value};if(mode==='register'){if(!turnstileToken)throw Error('Please complete the anti-bot verification.');Object.assign(body,{first_name:first.value,last_name:last.value,username:username.value,ref:new URLSearchParams(location.search).get('ref')||'',turnstile_token:turnstileToken});}const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');csrfToken=d.csrf_token||'';if(ret){location.href=ret;return}showDash(d.user)}catch(e){authError.textContent=e.message}finally{authBtn.disabled=false;if(mode==='register')resetTurnstile()}}
async function init(){try{const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({action:'me'})});const d=await r.json();if(r.ok&&d.user){csrfToken=d.csrf_token||'';showDash(d.user)}}catch{}}function showDash(u){me=u;auth.classList.add('hidden');dash.classList.remove('hidden');welcome.textContent=u.email;balance.textContent='$'+Number(u.balance).toFixed(6);earnings.textContent='$'+Number(u.total_earnings).toFixed(6);clicks.textContent=u.total_clicks;today.textContent='$'+Number(u.today_earnings).toFixed(6);last4.textContent='••••••••'+u.api_key_last4;loadAll()}
async function api(action,payload={}){const h={'Content-Type':'application/json'};if(!['get_public_config','get_me','get_links','get_withdrawals','get_referrals'].includes(action))h['X-CSRF-Token']=csrfToken;const r=await fetch('/api/user',{method:'POST',headers:h,credentials:'same-origin',body:JSON.stringify({action,payload})});const d=await r.json();if(!r.ok||d.error)throw Error(d.error||'Request failed');return d}
async function loadAll(){try{const [l,c]=await Promise.all([api('get_links'),api('get_referrals')]);links.innerHTML=(l.links||[]).map(x=>`<div class="bg-slate-950 rounded-xl p-3 flex flex-col md:flex-row md:items-center gap-2"><div class="flex-1"><div class="font-mono text-sm">${esc(x.short_id)}</div><div class="text-xs text-slate-500 truncate">${esc(x.original_url)}</div></div><a class="text-indigo-400 text-sm" href="${esc('/s/'+x.short_id)}" target="_blank">Open</a><div class="text-xs">${x.clicks} clicks · $${Number(x.earnings).toFixed(6)}</div></div>`).join('')||'<div class="text-slate-500">No links yet.</div>';refLink.value=c.referral_url}catch(e){console.error(e)}}
async function createLink(){created.innerHTML='';try{const d=await api('create_link',{original_url:longUrl.value});created.innerHTML=`<div class="bg-emerald-500/10 border border-emerald-500/20 rounded-xl p-3"><div class="text-sm">Short URL</div><div class="font-mono text-indigo-300 break-all">${esc(d.short_url)}</div></div>`;longUrl.value='';loadAll()}catch(e){created.innerHTML=`<div class="text-red-400">${esc(e.message)}</div>`}}
async function rotateKey(){if(!confirm('Rotate your API key? The old key will stop working.'))return;try{const d=await api('rotate_api_key');alert('NEW API KEY — save it now:\n\n'+d.api_key);last4.textContent='••••••••'+d.api_key_last4}catch(e){alert(e.message)}}
async function withdraw(){withdrawMsg.textContent='';try{const d=await api('withdraw',{amount:Number(amount.value),method:method.value,details:details.value,idempotency_key:crypto.randomUUID().replaceAll('-','').slice(0,32)});withdrawMsg.className='text-sm mt-2 text-emerald-400';withdrawMsg.textContent='Withdrawal submitted: '+d.withdrawal_id;location.reload()}catch(e){withdrawMsg.className='text-sm mt-2 text-red-400';withdrawMsg.textContent=e.message}}
async function logout(){await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({action:'logout'})});location.href='/'}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;',"\"":'&quot;'}[c]))}
async function loadAds(){try{const r=await fetch('/api/ads',{credentials:'same-origin'}),d=await r.json();if(!r.ok)return;const a=d.ads||{};for(const [id,key] of [['ad-header','header'],['ad-left','left_sidebar'],['ad-right','right_sidebar'],['ad-bottom','bottom_banner']]){const el=document.getElementById(id);if(el&&a[key])el.innerHTML=a[key]}}catch{}}
loadAds();loadSecurityConfig();init();
</script></body></html>
