<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrazyShort Admin</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Inter,system-ui;background:#0f172a;color:#f8fafc}.glass{background:rgba(30,41,59,.86);border:1px solid rgba(255,255,255,.07);border-radius:1rem}input,textarea,select{outline:none}</style></head>
<body class="min-h-screen">
<div id="login" class="min-h-screen flex items-center justify-center p-4"><div class="glass p-8 w-full max-w-sm"><h1 class="text-2xl font-bold mb-2">CrazyShort Admin</h1><p class="text-slate-400 text-sm mb-6">Web edition control panel</p><input id="password" type="password" autocomplete="current-password" placeholder="Admin password" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 mb-3"><button onclick="login()" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 rounded-xl py-3 font-bold">Login</button><p id="loginError" class="text-red-400 text-xs mt-3"></p></div></div>
<div id="app" class="flex flex-col md:flex-row min-h-screen"><aside class="w-full md:w-64 shrink-0 bg-slate-950 border-r border-slate-800 p-4 flex flex-col"><h1 class="font-bold text-xl text-indigo-400 mb-8">⚡ TeleAdmin</h1><nav class="space-y-2 flex-1"><button data-tab="dashboard" onclick="tab('dashboard')" class="nav w-full text-left p-3 rounded-xl">Dashboard</button><button data-tab="users" onclick="tab('users')" class="nav w-full text-left p-3 rounded-xl">Users</button><button data-tab="steps" onclick="tab('steps')" class="nav w-full text-left p-3 rounded-xl">Visit Steps</button><button data-tab="withdrawals" onclick="tab('withdrawals')" class="nav w-full text-left p-3 rounded-xl">Withdrawals</button><button data-tab="settings" onclick="tab('settings')" class="nav w-full text-left p-3 rounded-xl">Settings</button><button data-tab="audit" onclick="tab('audit')" class="nav w-full text-left p-3 rounded-xl">Audit Log</button></nav><button onclick="logout()" class="text-left p-3 text-red-400">Logout</button></aside><main id="content" class="flex-1 p-4 md:p-8 overflow-auto"></main></div>
<script>
const API='/api/admin',VAPI='/api/admin-visits';let csrf='';const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function call(action,payload={},mutating=false,api=API,retry=true){const h={'Content-Type':'application/json'};if(mutating)h['X-CSRF-Token']=csrf;const r=await fetch(api,{method:'POST',headers:h,credentials:'same-origin',body:JSON.stringify({action,payload})});const d=await r.json().catch(()=>({error:'Invalid server response'}));if(r.status===401){showLogin();throw Error(d.error||'Unauthorized')}if(mutating&&r.status===403&&d.error==='CSRF validation failed.'&&retry){const cr=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({action:'get_csrf'})});const cd=await cr.json().catch(()=>({}));if(cr.ok&&cd.csrf_token){csrf=cd.csrf_token;return call(action,payload,true,api,false)}}if(!r.ok||d.error)throw Error(d.error||'Request failed');return d}
async function login(){const p=password.value;loginBtn.disabled=true;loginError.textContent='';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({action:'login',password:p})});const d=await r.json();if(!r.ok)throw Error(d.error||'Invalid credentials');csrf=d.csrf_token;login.classList.add('hidden');app.classList.remove('hidden');await tab('dashboard')}catch(e){loginError.textContent=e.message}finally{loginBtn.disabled=false}}
function showLogin(){app.classList.add('hidden');login.classList.remove('hidden');csrf=''}async function logout(){try{await call('logout')}finally{showLogin()}}
function nav(a){document.querySelectorAll('.nav').forEach(b=>{b.classList.toggle('bg-indigo-600',b.dataset.tab===a);b.classList.toggle('text-white',b.dataset.tab===a);b.classList.toggle('text-slate-400',b.dataset.tab!==a)})}
async function tab(name){nav(name);content.innerHTML='<div class="py-20 text-center text-slate-400">Loading…</div>';try{if(name==='dashboard'){const d=await call('get_dashboard');content.innerHTML=`<h2 class="text-2xl font-bold mb-6">Dashboard</h2><div class="grid grid-cols-2 lg:grid-cols-6 gap-4">${[['Users',d.totalUsers],['Blocked',d.blockedUsers],['Active today',d.activeToday],['Active steps',d.activeSteps],['Pending','$'+Number(d.pendingAmount).toFixed(6)],['Paid','$'+Number(d.totalPaid).toFixed(6)]].map(x=>`<div class="glass p-5"><div class="text-xs text-slate-400">${x[0]}</div><div class="text-2xl font-bold mt-2">${x[1]}</div></div>`).join('')}</div>`}
else if(name==='users'){const d=await call('get_users');content.innerHTML=`<h2 class="text-2xl font-bold mb-6">Users</h2><div class="glass overflow-auto"><table class="w-full text-sm"><thead class="bg-slate-950"><tr><th class="p-3 text-left">Email</th><th class="p-3 text-left">Name</th><th class="p-3">API Key</th><th class="p-3">Balance</th><th class="p-3">Status</th><th class="p-3">Action</th></tr></thead><tbody>${(d.users||[]).map(u=>`<tr class="border-t border-slate-800"><td class="p-3">${esc(u.email)}</td><td class="p-3">${esc(u.first_name||u.username||'User')}</td><td class="p-3 font-mono text-xs text-slate-400">${esc(u.api_key)}</td><td class="p-3 font-bold">$${Number(u.balance).toFixed(6)}</td><td class="p-3">${u.is_blocked?'<span class="text-red-400">Blocked</span>':'<span class="text-emerald-400">Active</span>'}</td><td class="p-3"><button onclick="blockUser('${esc(u.id)}',${u.is_blocked?0:1})" class="px-3 py-1 rounded bg-slate-800">${u.is_blocked?'Unblock':'Block'}</button></td></tr>`).join('')}</tbody></table></div>`}
else if(name==='steps'){const d=await call('get_steps',{},false,VAPI);content.innerHTML=`<div class="flex items-center justify-between mb-6"><div><h2 class="text-2xl font-bold">Visit Steps</h2><p class="text-slate-400 text-sm mt-1">Each website is mandatory and uses the step wait time.</p></div><button onclick="addStep()" class="bg-indigo-600 px-4 py-2 rounded-xl font-bold">+ Add Step</button></div>${(d.steps||[]).map(st=>stepCard(st)).join('')||'<div class="glass p-8 text-slate-400">No steps configured yet.</div>'}`}
else if(name==='withdrawals'){const d=await call('get_withdrawals');content.innerHTML=`<h2 class="text-2xl font-bold mb-6">Withdrawals</h2><div class="glass overflow-auto"><table class="w-full text-sm"><thead class="bg-slate-950"><tr><th class="p-3 text-left">User</th><th class="p-3">Method</th><th class="p-3">Details</th><th class="p-3">Amount</th><th class="p-3">Status</th><th class="p-3">Action</th></tr></thead><tbody>${(d.withdrawals||[]).map(w=>`<tr class="border-t border-slate-800"><td class="p-3">${esc(w.email)}</td><td class="p-3">${esc(w.method)}</td><td class="p-3 text-xs max-w-xs break-all">${esc(w.details)}</td><td class="p-3 font-bold">$${Number(w.amount).toFixed(6)}</td><td class="p-3 uppercase">${esc(w.status)}</td><td class="p-3">${w.status==='pending'?`<button onclick="processW('${w.id}','paid')" class="bg-emerald-600 px-2 py-1 rounded mr-1">Paid</button><button onclick="processW('${w.id}','rejected')" class="bg-red-600 px-2 py-1 rounded">Reject</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
else if(name==='settings'){const d=await call('get_settings'),s=d.settings||{};content.innerHTML=`<h2 class="text-2xl font-bold mb-6">Settings</h2><div class="glass p-6 max-w-3xl grid md:grid-cols-2 gap-4"><label class="text-xs">CPM ($)<input id="cpm" type="number" step="0.000001" value="${s.cpm}" class="w-full bg-slate-950 p-3 rounded-xl mt-1"></label><label class="text-xs">Minimum withdrawal ($)<input id="min" type="number" step="0.000001" value="${s.min_withdraw}" class="w-full bg-slate-950 p-3 rounded-xl mt-1"></label><label class="text-xs">Referral %<input id="ref" type="number" min="0" max="50" value="${s.refer_percent}" class="w-full bg-slate-950 p-3 rounded-xl mt-1"></label><label class="text-xs">Default wait (seconds)<input id="wait" type="number" min="1" max="120" value="${s.default_wait_seconds}" class="w-full bg-slate-950 p-3 rounded-xl mt-1"></label><label class="text-xs">Heartbeat (seconds)<input id="hb" type="number" min="2" max="15" value="${s.heartbeat_seconds}" class="w-full bg-slate-950 p-3 rounded-xl mt-1"></label><label class="text-xs">Session timeout (seconds)<input id="timeout" type="number" min="60" max="3600" value="${s.session_timeout_seconds}" class="w-full bg-slate-950 p-3 rounded-xl mt-1"></label><label class="text-xs md:col-span-2">Payment methods (comma separated)<input id="methods" value="${esc(s.payment_methods)}" class="w-full bg-slate-950 p-3 rounded-xl mt-1"></label><div class="md:col-span-2 border-t border-slate-700 pt-5"><h3 class="font-bold text-lg">Banner Ads</h3><p class="text-xs text-slate-400 mt-1 mb-4">Paste trusted ad-network banner HTML/JS snippets. These are rendered only on the selected public positions.</p><div class="grid gap-4"><label class="text-xs">Header Banner<textarea id="ad_header" rows="4" class="w-full bg-slate-950 p-3 rounded-xl mt-1" placeholder="Paste header banner code">${esc(s.banner_ads?.header||'')}</textarea></label><label class="text-xs">Left Sidebar Banner<textarea id="ad_left" rows="4" class="w-full bg-slate-950 p-3 rounded-xl mt-1" placeholder="Paste left sidebar banner code">${esc(s.banner_ads?.left_sidebar||'')}</textarea></label><label class="text-xs">Right Sidebar Banner<textarea id="ad_right" rows="4" class="w-full bg-slate-950 p-3 rounded-xl mt-1" placeholder="Paste right sidebar banner code">${esc(s.banner_ads?.right_sidebar||'')}</textarea></label><label class="text-xs">Bottom Banner<textarea id="ad_bottom" rows="4" class="w-full bg-slate-950 p-3 rounded-xl mt-1" placeholder="Paste bottom banner code">${esc(s.banner_ads?.bottom_banner||'')}</textarea></label></div></div><button onclick="saveSettings()" class="md:col-span-2 bg-indigo-600 rounded-xl p-3 font-bold">Save settings</button></div>`}
else {const d=await call('get_audit_logs');content.innerHTML=`<h2 class="text-2xl font-bold mb-6">Audit Log</h2><div class="space-y-2">${(d.logs||[]).map(x=>`<div class="glass p-4 text-xs"><b>${esc(x.action)}</b> · ${esc(x.target_type)} ${esc(x.target_id)}<div class="text-slate-500 mt-1">${esc(x.created_at)}</div></div>`).join('')}</div>`}}catch(e){content.innerHTML=`<div class="glass p-6 text-red-400">${esc(e.message)}</div>`}}
function stepCard(st){return `<div class="glass p-5 mb-5"><div class="flex flex-wrap items-center justify-between gap-3"><div><div class="text-xs text-indigo-400 font-bold">STEP ${st.step_number}</div><input id="title_${st.id}" value="${esc(st.title||'Step '+st.step_number)}" class="bg-slate-950 rounded-lg p-2 mt-1 text-lg font-bold"><input id="desc_${st.id}" value="${esc(st.description||'')}" placeholder="Optional description" class="bg-slate-950 rounded-lg p-2 mt-2 block w-full text-sm"></div><div class="flex items-center gap-2"><label class="text-xs">Wait <input id="wait_${st.id}" type="number" min="1" max="120" value="${st.wait_seconds}" class="w-20 bg-slate-950 rounded-lg p-2"> sec</label><button onclick="toggleStep('${st.id}',${st.enabled?0:1})" class="px-3 py-2 rounded-lg bg-slate-800">${st.enabled?'Disable':'Enable'}</button><button onclick="saveStep('${st.id}')" class="px-3 py-2 rounded-lg bg-indigo-600">Save</button><button onclick="deleteStep('${st.id}')" class="px-3 py-2 rounded-lg bg-red-600/80">Delete</button></div></div><div class="mt-5 space-y-2">${(st.websites||[]).map((w,i)=>`<div class="grid md:grid-cols-[40px_1fr_2fr_auto] gap-2 items-center bg-slate-950/70 rounded-xl p-3"><span class="text-slate-500">${i+1}</span><input id="wt_${w.id}" value="${esc(w.title||'Visit Website')}" class="bg-slate-900 rounded-lg p-2 text-sm"><input id="wu_${w.id}" value="${esc(w.url)}" class="bg-slate-900 rounded-lg p-2 text-sm"><div class="flex gap-2"><button onclick="saveWebsite('${w.id}')" class="px-3 py-2 rounded-lg bg-indigo-600">Save</button><button onclick="deleteWebsite('${w.id}')" class="px-3 py-2 rounded-lg bg-red-600/80">×</button></div></div>`).join('')||'<div class="text-slate-500 text-sm">No websites yet.</div>'}</div><div class="mt-4 grid md:grid-cols-[1fr_2fr_auto] gap-2"><input id="newtitle_${st.id}" placeholder="Website title" class="bg-slate-950 rounded-lg p-3"><input id="newurl_${st.id}" placeholder="https://example.com" class="bg-slate-950 rounded-lg p-3"><button onclick="addWebsite('${st.id}')" class="bg-emerald-600 rounded-lg px-4">+ Website</button></div></div>`}
async function addStep(){try{await call('create_step',{title:'New Step',wait_seconds:10},true,VAPI);await tab('steps')}catch(e){alert(e.message)}}
async function saveStep(id){try{await call('update_step',{id,title:document.getElementById('title_'+id).value,description:document.getElementById('desc_'+id).value,wait_seconds:Number(document.getElementById('wait_'+id).value)},true,VAPI);await tab('steps')}catch(e){alert(e.message)}}
async function toggleStep(id,enabled){try{await call('toggle_step',{id,enabled},true,VAPI);await tab('steps')}catch(e){alert(e.message)}}
async function deleteStep(id){if(!confirm('Delete this step and its websites?'))return;try{await call('delete_step',{id},true,VAPI);await tab('steps')}catch(e){alert(e.message)}}
async function addWebsite(step_id){try{await call('add_website',{step_id,title:document.getElementById('newtitle_'+step_id).value,url:document.getElementById('newurl_'+step_id).value},true,VAPI);await tab('steps')}catch(e){alert(e.message)}}
async function saveWebsite(id){try{await call('update_website',{id,title:document.getElementById('wt_'+id).value,url:document.getElementById('wu_'+id).value},true,VAPI);await tab('steps')}catch(e){alert(e.message)}}
async function deleteWebsite(id){if(!confirm('Delete this website?'))return;try{await call('delete_website',{id},true,VAPI);await tab('steps')}catch(e){alert(e.message)}}
async function blockUser(id,status){if(!confirm(status?'Block this user?':'Unblock this user?'))return;try{await call('toggle_block',{user_id:id,is_blocked:status},true);await tab('users')}catch(e){alert(e.message)}}
async function processW(id,status){if(!confirm(status==='paid'?'Confirm payment was sent?':'Reject and refund this withdrawal?'))return;try{await call('process_withdrawal',{withdraw_id:id,status},true);await tab('withdrawals')}catch(e){alert(e.message)}}
async function saveSettings(){try{await call('save_settings',{updates:{cpm:Number(cpm.value),min_withdraw:Number(min.value),refer_percent:Number(ref.value),default_wait_seconds:Number(wait.value),heartbeat_seconds:Number(hb.value),session_timeout_seconds:Number(timeout.value),payment_methods:methods.value,banner_ads:{header:document.getElementById('ad_header')?.value||'',left_sidebar:document.getElementById('ad_left')?.value||'',right_sidebar:document.getElementById('ad_right')?.value||'',bottom_banner:document.getElementById('ad_bottom')?.value||''}}},true);alert('Settings saved');await tab('settings')}catch(e){alert(e.message)}}
</script></body></html>
