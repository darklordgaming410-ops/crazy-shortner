<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complete Visit - TeleShort</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Inter,system-ui;background:#0f172a;color:#f8fafc;overflow-x:hidden}.ad-slot{display:flex;justify-content:center;align-items:center;overflow:hidden}.glass{background:rgba(30,41,59,.88);border:1px solid rgba(255,255,255,.08);border-radius:1.25rem}</style></head><body class="min-h-screen"><div id="ad-header" class="ad-slot w-full px-3 py-2"></div><div class="min-h-[calc(100vh-90px)] flex items-start justify-center p-3 sm:p-4"><div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-[180px_minmax(0,1fr)_180px] gap-4 items-start"><aside id="ad-left" class="ad-slot hidden lg:flex sticky top-4"></aside><main class="glass w-full max-w-xl p-5 sm:p-7 text-center mx-auto min-w-0"><div class="text-4xl mb-3">🌐</div><div id="state"><h1 class="text-2xl font-bold">Loading visit…</h1><p class="text-slate-400 mt-2">Please wait.</p></div></main><aside id="ad-right" class="ad-slot hidden lg:flex sticky top-4"></aside></div></div><div id="ad-bottom" class="ad-slot w-full px-3 py-2"></div><script>
async function loadAds(){try{const r=await fetch('/api/ads'),d=await r.json();if(!r.ok)return;const a=d.ads||{};for(const [id,key] of [['ad-header','header'],['ad-left','left_sidebar'],['ad-right','right_sidebar'],['ad-bottom','bottom_banner']]){const e=document.getElementById(id);if(e&&a[key])e.innerHTML=a[key]}}catch{}}
loadAds();
const shortId=new URLSearchParams(location.search).get('short')||'',state=document.getElementById('state');let sessionId='',attemptId='',targetUrl='',timer=null,required=10,remaining=10,started=false,activated=false,heartbeatTimer=null,csrfToken='',powNonce='',powSolution='';
async function solvePow(nonce,difficulty){for(let i=0;i<20000000;i++){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(nonce+':'+i));const x=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');if(x.startsWith('0'.repeat(difficulty)))return String(i)}throw Error('Anti-bot verification failed. Please retry.')}
async function getPow(){const r=await fetch('/api/visit',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},credentials:'same-origin',body:JSON.stringify({action:'challenge',payload:{}})});const d=await r.json();if(!r.ok)throw Error(d.error||'Challenge failed');powNonce=d.nonce;powSolution=await solvePow(d.nonce,Number(d.difficulty||5));}
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(action,payload={}){const r=await fetch('/api/visit',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},credentials:'same-origin',body:JSON.stringify({action,payload})});const d=await r.json().catch(()=>({error:'Invalid response'}));if(r.status===401){location.href='/?return='+encodeURIComponent('/visit.html?short='+shortId);throw Error('Please log in first.')}if(!r.ok||d.error)throw Error(d.error||'Request failed');return d}
async function start(){try{const ar=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({action:'me'})});const ad=await ar.json().catch(()=>({}));if(!ar.ok||!ad.user){location.href='/?return='+encodeURIComponent('/visit.html?short='+shortId);return}csrfToken=ad.csrf_token||'';await getPow();const d=await api('start',{short_id:shortId,pow_nonce:powNonce,pow_solution:powSolution});sessionId=d.session_id;attemptId=d.attempt_id;targetUrl=d.website.url;required=Number(d.required_seconds||10);remaining=Math.max(0,required-Number(d.elapsed_seconds||0));activated=!!d.activated;render(d);if(activated)startTimer(); }catch(e){state.innerHTML=`<h1 class="text-2xl font-bold">Unable to start</h1><p class="text-red-400 mt-3">${esc(e.message)}</p><a class="inline-block mt-5 bg-indigo-600 px-5 py-3 rounded-xl" href="/">Dashboard</a>`}}
function render(d){
 state.innerHTML=`<div class="text-xs text-indigo-400 font-bold">${esc(d.step_title||'Visit Step')}</div><h1 class="text-2xl font-bold mt-2">${esc(d.website.title||'Visit Website')}</h1><p class="text-slate-400 mt-2">Step ${esc(d.step)} · Website ${esc(d.position)}</p><div id="timer" class="text-6xl font-black my-8">${remaining}</div><p id="hint" class="text-slate-400">${activated?'Return to this tab after spending the required time on the website.':'Click the button to open the website and start the timer. Keep this visit open for '+required+' seconds, then return here to verify.'}</p><button id="open" onclick="openTarget()" class="${activated?'hidden ':''}mt-5 w-full bg-indigo-600 rounded-xl p-4 font-bold">Open Website</button><button id="verify" onclick="complete()" ${remaining>0?'disabled':''} class="${remaining>0?'hidden ':''} mt-3 w-full bg-emerald-600 disabled:opacity-40 rounded-xl p-4 font-bold">Verify Visit</button><div id="msg" class="text-sm mt-4"></div>`;
 if(activated&&remaining===0)showVerify();
}
async function openTarget(){
 if(started)return;
 const win=window.open(targetUrl,'_blank','noopener,noreferrer');
 if(!win){document.getElementById('msg').className='text-sm mt-4 text-red-400';document.getElementById('msg').textContent='Popup blocked. Please allow popups for this site and try again.';return;}
 try{
  const a=await api('activate',{session_id:sessionId,attempt_id:attemptId});
  activated=true;started=true;remaining=Math.max(0,required-Number(a.elapsed_seconds||0));
  document.getElementById('open').disabled=true;document.getElementById('open').textContent='Website opened — return here after the timer';
  document.getElementById('hint').textContent='Return to this tab after spending the required time on the website. The server checks the visit session time.';
  startTimer();
 }catch(e){try{win.close()}catch{};document.getElementById('msg').className='text-sm mt-4 text-red-400';document.getElementById('msg').textContent=e.message;}
}
function startTimer(){
 started=true;
 heartbeat();heartbeatTimer=setInterval(heartbeat,3000);
 if(remaining===0){showVerify();return;}
 clearInterval(timer);
 timer=setInterval(()=>{remaining=Math.max(0,remaining-1);document.getElementById('timer').textContent=remaining;if(remaining===0){clearInterval(timer);showVerify()}},1000);
}
function showVerify(){document.getElementById('verify').classList.remove('hidden');document.getElementById('verify').disabled=false;document.getElementById('hint').textContent='Minimum time reached. Return from the website and verify this visit.'}
async function heartbeat(){try{await api('heartbeat',{session_id:sessionId,attempt_id:attemptId})}catch(e){document.getElementById('msg').textContent=e.message}}
async function complete(){const b=document.getElementById('verify');b.disabled=true;try{const d=await api('complete',{session_id:sessionId,attempt_id:attemptId});clearInterval(heartbeatTimer);if(d.all_completed){state.innerHTML=`<div class="text-4xl">✅</div><h1 class="text-2xl font-bold mt-3">Link Unlocked</h1><p class="text-slate-400 mt-2">All required website visits are complete.</p><a href="${esc(d.original_url)}" class="block mt-6 bg-emerald-600 rounded-xl p-4 font-bold">Continue to Destination</a>`}else{sessionId=d.session_id;attemptId=d.attempt_id;required=Number(d.required_seconds||10);remaining=required;started=false;activated=false;clearInterval(timer);clearInterval(heartbeatTimer);timer=null;heartbeatTimer=null;render(d)}}catch(e){b.disabled=false;document.getElementById('msg').className='text-sm mt-4 text-red-400';document.getElementById('msg').textContent=e.message;if(e.message.includes('more second')){}}}
start();
</script></body></html>
